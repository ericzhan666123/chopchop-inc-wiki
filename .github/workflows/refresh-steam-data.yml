name: Refresh Steam data

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/fetch-steam-data.mjs
      - name: Commit changed Steam data
        shell: bash
        run: |
          if git diff --quiet -- content/en/achievements.json content/en/updates.json; then
            echo "Steam data is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/en/achievements.json content/en/updates.json
          git commit -m "chore: refresh Steam data"
          git push
